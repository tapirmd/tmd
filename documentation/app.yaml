runtime: python313

default_expiration: "3650d"

automatic_scaling:
  target_cpu_utilization: 0.91
  max_concurrent_requests: 64
  min_pending_latency: 900ms
  max_idle_instances: 1
  max_instances: 1

handlers:
- url: /
  static_files: pages/@tmd-build/pages/index.html
  upload: index.html
  expiration: "1d"

- url: /@assets/(.*)
  static_files: pages/@tmd-build/pages/@assets/\1
  upload: "@assets/(.*)"

- url: /(.*)
  static_files: pages/@tmd-build/pages/\1
  upload: (.*)
  expiration: "1d"

- url: /.*
  script: auto
  secure: always
  redirect_http_response_code: 301
